name: Launcher checks

on:
  push:
    paths:
      - 'Launcher/**'
      - 'Game/Source/VeyraServices/Contracts/LaunchHandshake.json'
      - 'ConceptArt/Vanguards/*/hero.webp'
      - '.github/workflows/launcher.yml'
  pull_request:
    paths:
      - 'Launcher/**'
      - 'Game/Source/VeyraServices/Contracts/LaunchHandshake.json'
      - 'ConceptArt/Vanguards/*/hero.webp'
      - '.github/workflows/launcher.yml'

jobs:
  check:
    # The Tauri app needs WebView2, so the whole workspace is checked on Windows, as it ships.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            Launcher/target
          key: launcher-${{ runner.os }}-${{ hashFiles('Launcher/Cargo.lock') }}
          restore-keys: launcher-${{ runner.os }}-
      - name: fmt, clippy, test and release build
        shell: pwsh
        run: ./Launcher/Check.ps1
      # Veyra Setup (ADR-022 §2), from the release build above.
      - name: NSIS
        shell: pwsh
        run: |
          $found = (Get-Command makensis -ErrorAction SilentlyContinue) -or (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")
          if (-not $found) {
            choco install nsis --no-progress -y
          }
      - name: Veyra Setup
        shell: pwsh
        run: ./Launcher/Package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: VeyraSetup
          path: Launcher/target/setup/VeyraSetup-*.exe
          if-no-files-found: error
