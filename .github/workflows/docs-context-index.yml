name: Documentation checks

on:
  push:
    paths:
      - 'Docs/**'
      - 'ConceptArt/**'
      - 'ARCHITECTURE.md'
      - 'PROJECT_STRUCTURE.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
      - 'scripts/check_doc_context.py'
      - 'tests/test_doc_context.py'
      - '.github/workflows/docs-context-index.yml'
  pull_request:
    paths:
      - 'Docs/**'
      - 'ConceptArt/**'
      - 'ARCHITECTURE.md'
      - 'PROJECT_STRUCTURE.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
      - 'scripts/check_doc_context.py'
      - 'tests/test_doc_context.py'
      - '.github/workflows/docs-context-index.yml'

jobs:
  verify-context-index:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML (required by the Vanguard data tools)
        run: python3 -m pip install pyyaml
      - name: Regression-test context index maintenance
        run: python3 -m unittest discover -s tests -p 'test_doc_context.py'
      - name: Verify active bible routing and section locators
        run: python3 scripts/check_doc_context.py --check
      - name: Validate Vanguard data layer
        run: python3 Docs/Design/Vanguards/validate.py
      - name: Verify rendered sheets match canon (fail on drift)
        run: |
          python3 Docs/Design/Vanguards/render_sheet.py --all
          git diff --exit-code Docs/Design/Vanguards/sheets
          untracked="$(git status --porcelain --untracked-files=all Docs/Design/Vanguards/sheets)"
          if [ -n "$untracked" ]; then
            echo "Rendered sheets differ from the committed ones:"
            echo "$untracked"
            exit 1
          fi
