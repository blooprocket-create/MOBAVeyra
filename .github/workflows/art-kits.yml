name: Art kit checks

on:
  push:
    paths:
      - 'Game/ArtSource/Structures/StructureKit.json'
      - 'Game/ArtSource/Fluxborn/FluxbornKit.json'
      - 'Game/ArtSource/Environment/CrucibleKit.json'
      - 'Game/ArtSource/Environment/manifest.json'
      - 'Game/ArtSource/Vanguards/VanguardKit.json'
      - 'Game/Scripts/KitMaterials/spec.py'
      - 'Game/Scripts/EnvironmentKit/inputs.py'
      - 'tests/test_kit_materials_spec.py'
      - 'tests/test_environment_kit_inputs.py'
      - 'Game/Scripts/fbx_content.py'
      - 'tests/test_fbx_content.py'
      - 'tests/fixtures/fbx/**'
      - '.github/workflows/art-kits.yml'
  pull_request:
    paths:
      - 'Game/ArtSource/Structures/StructureKit.json'
      - 'Game/ArtSource/Fluxborn/FluxbornKit.json'
      - 'Game/ArtSource/Environment/CrucibleKit.json'
      - 'Game/ArtSource/Environment/manifest.json'
      - 'Game/ArtSource/Vanguards/VanguardKit.json'
      - 'Game/Scripts/KitMaterials/spec.py'
      - 'Game/Scripts/EnvironmentKit/inputs.py'
      - 'tests/test_kit_materials_spec.py'
      - 'tests/test_environment_kit_inputs.py'
      - 'Game/Scripts/fbx_content.py'
      - 'tests/test_fbx_content.py'
      - 'tests/fixtures/fbx/**'
      - '.github/workflows/art-kits.yml'

jobs:
  verify-art-kits:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the kits' material values without Unreal
        run: python3 -m unittest discover -s tests -p 'test_kit_materials_spec.py'
      - name: Check the environment meshes were generated from the committed kit
        run: python3 -m unittest discover -s tests -p 'test_environment_kit_inputs.py'
      - name: Check that a generator keeps an FBX whose content is unchanged
        run: python3 -m unittest discover -s tests -p 'test_fbx_content.py'
