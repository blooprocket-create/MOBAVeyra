[package]
name = "veyra-publish"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "veyra_publish"

[[bin]]
name = "veyra-publish"
path = "src/main.rs"

[dependencies]
# Content-defined chunks (ADR-022 §4).
fastcdc = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
veyra-launcher-core = { path = "../core" }
zstd = { version = "0.14", default-features = false }
