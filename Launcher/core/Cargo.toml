[package]
name = "veyra-launcher-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "veyra_launcher_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# All of the launcher's HTTP, over rustls, so the web view makes no cross-origin calls (ADR-010 §5).
ureq = { version = "3", features = ["json"] }
