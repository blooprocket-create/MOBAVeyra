[package]
name = "veyra-launch-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "veyra-launch-cli"
path = "src/main.rs"

# The launcher's install, update, repair and uninstall without its window (ADR-022 §8).
[[bin]]
name = "veyra-install"
path = "src/bin/install.rs"

# A stand-in for the game that speaks the launch handshake, for this package's tests and for
# scripts that check a launcher without the engine.
[[bin]]
name = "veyra-fake-game"
path = "src/bin/fake_game.rs"

# A stand-in for Veyra Setup that records the switches it was started with, for the self-update tests
# (ADR-022 §11).
[[bin]]
name = "veyra-fake-setup"
path = "src/bin/fake_setup.rs"

[dependencies]
veyra-launcher-core = { path = "../core" }

[dev-dependencies]
serde_json = "1"
# The install tests publish their releases.
veyra-publish = { path = "../publish" }
