<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veyra</title>
<link rel="stylesheet" href="launcher.css">
<script src="launcher.js" defer></script>
</head>
<body>
<div class="art" aria-hidden="true"></div>
<main>
  <header>
    <p class="eyebrow">The Meridian Crucible</p>
    <h1>Veyra</h1>
  </header>

  <section id="loading">
    <p class="status">Contacting Veyra's services…</p>
    <div class="working" aria-hidden="true"></div>
  </section>

  <section id="install" hidden>
    <h2 id="install-title">Install Veyra</h2>
    <p class="note" id="install-note"></p>
    <label for="folder">Install location</label>
    <div class="folder">
      <output id="folder"></output>
      <button id="change-folder" type="button" class="quiet">Change</button>
    </div>
    <button id="install-button" type="button" class="primary">Install</button>
  </section>

  <section id="installing" hidden>
    <h2 id="install-stage"></h2>
    <div class="bar" role="progressbar" aria-labelledby="install-stage" aria-valuemin="0" aria-valuemax="100">
      <div class="fill" id="install-fill"></div>
    </div>
    <div class="figures">
      <span id="install-percent"></span>
      <span id="install-bytes"></span>
    </div>
    <p class="note" id="install-speed"></p>
  </section>

  <section id="sign-in" hidden>
    <h2>Sign In</h2>
    <p class="note">Development sign-in: choose an account. There is no password until Veyra's identity provider arrives.</p>
    <label for="account">Account</label>
    <select id="account"></select>
    <button id="play" type="button" class="primary">Play</button>
    <p class="note warning" id="game-note" hidden></p>
  </section>

  <section id="progress" hidden>
    <p class="status" id="stage"></p>
    <div class="working" aria-hidden="true"></div>
    <p class="note">The launcher closes once Veyra has signed you in.</p>
  </section>

  <section id="problem" hidden>
    <h2>Something went wrong</h2>
    <p id="problem-text"></p>
    <button id="retry" type="button">Try Again</button>
  </section>

  <footer>
    <button id="repair" type="button" class="link" hidden>Repair</button>
    <span id="build"></span>
  </footer>
</main>
</body>
</html>
