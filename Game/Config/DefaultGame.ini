[/Script/VeyraMatch.VeyraCameraSettings]
; The default top-down view of your own Vanguard.
Distance=1600
PitchDegrees=-60

[/Script/VeyraServices.VeyraServicesSettings]
; Where the local backend is and how long to wait for it (ADR-005, ADR-007). Deployment settings,
; not tuning: a hosted build overrides them. Every value is required; the game refuses zero.
; The URL is quoted because the engine reads an unquoted "//" as the start of a comment.
BackendBaseUrl="http://127.0.0.1:8080"
RequestTimeoutSeconds=10
; Launch codes live 20 s in the backend; the launcher writes one as soon as the game starts.
LaunchCodeReadTimeoutSeconds=30
MatchPollIntervalSeconds=1
; Longer than the backend's matches.readyTimeout (Backend/config/local.json), so the backend
; fails a match that never starts before the game gives up on it.
MatchWaitTimeoutSeconds=180
AssignmentReadTimeoutSeconds=30
AssignmentPollIntervalSeconds=0.05
ReportAttempts=5
ReportRetryIntervalSeconds=2
