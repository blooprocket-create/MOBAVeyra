[/Script/UnrealEd.ProjectPackagingSettings]
; Packaged builds cook only these maps and what they reference.
+MapsToCook=(FilePath="/Game/Veyra/FrontEnd/Maps/L_FrontEnd")
+MapsToCook=(FilePath="/Game/Veyra/Developer/Maps/L_Greybox")
