[/Script/GameplayAbilities.AbilitySystemGlobals]
; Gameplay Cues are presentation (VFX, audio) and live with Veyra's content
; (PROJECT_STRUCTURE.md §3). Without a path the ability system scans all of /Game.
+GameplayCueNotifyPaths=/Game/Veyra

[/Script/UnrealEd.ProjectPackagingSettings]
; Packaged builds cook only these maps and what they reference.
+MapsToCook=(FilePath="/Game/Veyra/Developer/Maps/L_Greybox")
; The grey-box presentation loads engine shapes by path (VeyraGreyboxSettings below), which no map references.
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")

