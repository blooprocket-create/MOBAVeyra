; The grey-box presentation loads engine shapes by path (VeyraGreyboxSettings below), which no map references.
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")
; The shell loads the Vanguards' art by path (VeyraShellArt), which no map references.
+DirectoriesToAlwaysCook=(Path="/Game/Veyra/UI")
; The structures' provisional art, which the grey-box presentation loads by path (VeyraGreyboxSettings).
+DirectoriesToAlwaysCook=(Path="/Game/Veyra/World/Structures")
+DirectoriesToAlwaysCook=(Path="/Game/Veyra/Flux/Fluxborn")
; The Vanguards' generated bodies, which the grey-box presentation loads by path (VeyraGreyboxSettings).
+DirectoriesToAlwaysCook=(Path="/Game/Veyra/Vanguards")
; The client's fonts (ADR-078 §2) are read as files, so they are staged beside the cooked content.
+DirectoriesToAlwaysStageAsUFS=(Path="Veyra/Fonts")

