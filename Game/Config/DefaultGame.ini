[/Script/VeyraServices.VeyraServicesSettings]
; Where the local backend is and how long to wait for it (ADR-005, ADR-007). Deployment settings,
; not tuning: a hosted build overrides them. Every value is required; the game refuses zero.
; The URL is quoted because the engine reads an unquoted "//" as the start of a comment.
BackendBaseUrl="http://127.0.0.1:8080"
RequestTimeoutSeconds=10
; Launch codes live 20 s in the backend; the launcher requests one only once the game says it
; awaits it (the launch handshake, ADR-010 §5).
LaunchCodeReadTimeoutSeconds=30
MatchPollIntervalSeconds=1
; Longer than the backend's matches.readyTimeout (Backend/config/local.json), so the backend
; fails a match that never starts before the game gives up on it.
MatchWaitTimeoutSeconds=180
; A request that gets no answer, or a server error, is tried this often before the player sees
; the problem and a Retry (ADR-010 §2).
ClientRequestAttempts=3
ClientRetryIntervalSeconds=2
; Champion select is polled: there is no push channel yet (ADR-010 §8).
SelectPollIntervalSeconds=0.5
ResultPollIntervalSeconds=1
; Longer than a match server's reporting (ReportAttempts x ReportRetryIntervalSeconds), so a
; result the server reports late still arrives.
ResultWaitTimeoutSeconds=30
ReconnectPollIntervalSeconds=5
; The party is polled too: a queue ends in Match Found, whose acceptance timer is 15 s
; (Backend/config/local.json), so both reads come well inside it.
PartyPollIntervalSeconds=1
MatchFoundPollIntervalSeconds=0.5
AssignmentReadTimeoutSeconds=30
AssignmentPollIntervalSeconds=0.05
ReportAttempts=5
ReportRetryIntervalSeconds=2

