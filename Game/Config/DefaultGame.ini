; Veyra project settings (ADR-006). Gameplay tuning never lives in ini files: it is validated,
; designer-editable data owned by its domain (ARCHITECTURE.md §1.3, ADR-006 §6).

[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=593E5FBF30034D7A9BFBAC2F8820A9D4
ProjectName=Veyra
CompanyName=Wayfinder Studios
CopyrightNotice=Copyright © 2026 Wayfinder Studios. All rights reserved.
; The build version the game reports when it redeems a launch code (ADR-005 L3). The backend binds
