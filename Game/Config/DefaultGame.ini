; Abilities' own effects, stage by stage (ADR-072 §4): Windup, Channel and Travel loop until their stage ends; Commit
; (in place of the shared flash, at the caster or where it was aimed) and Impact (where a projectile ends or a delayed
; area lands) are one burst each. Reaches and delays come from Abilities.json.
LengthParameter=Length
WidthParameter=Width
; An Area effect's shape (ADR-075 §3): 0 a circle, 1 a sector, 2 a rectangle; its radius, half-arc in degrees and how far it has landed (0 to 1).
ShapeParameter=Shape
RadiusParameter=Radius
HalfArcParameter=HalfArc
LandingParameter=Landing
SlopeAlongParameter=SlopeAlong
SlopeAcrossParameter=SlopeAcross
; How long after a cast's projectile was last drawn its server end still shows its impact (the end and its removal arrive in either order).
