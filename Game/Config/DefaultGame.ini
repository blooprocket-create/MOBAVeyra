[/Script/VeyraServices.VeyraServicesSettings]
; Where the local backend is and how long to wait for it (ADR-005, ADR-007). Deployment settings,
; not tuning: a hosted build overrides them. Every value is required; the game refuses zero.
; The URL is quoted because the engine reads an unquoted "//" as the start of a comment.
BackendBaseUrl="http://127.0.0.1:8080"
RequestTimeoutSeconds=10
; Launch codes live 20 s in the backend; the launcher requests one only once the game says it
; awaits it (the launch handshake, ADR-010 §5).
LaunchCodeReadTimeoutSeconds=30
MatchPollIntervalSeconds=1
; Longer than the backend's matches.readyTimeout (Backend/config/local.json), so the backend
; fails a match that never starts before the game gives up on it.
MatchWaitTimeoutSeconds=180
; A request that gets no answer, or a server error, is tried this often before the player sees
; the problem and a Retry (ADR-010 §2).
ClientRequestAttempts=3
ClientRetryIntervalSeconds=2
; Champion select is polled: there is no push channel yet (ADR-010 §8).
SelectPollIntervalSeconds=0.5
ResultPollIntervalSeconds=1
; Longer than a match server's reporting (ReportAttempts x ReportRetryIntervalSeconds), so a
; result the server reports late still arrives.
ResultWaitTimeoutSeconds=30
ReconnectPollIntervalSeconds=5
; Twenty minutes without a match ends a play streak, which the break reminder counts (ADR-053 §4).
PlayStreakGapSeconds=1200
; The party is polled too: a queue ends in Match Found, whose acceptance timer is 15 s
; (Backend/config/local.json), so both reads come well inside it.
PartyPollIntervalSeconds=1
MatchFoundPollIntervalSeconds=0.5
; A custom lobby and the friends panel are polled as well (ADR-021): a lobby's start shows within a
; read, well inside its champion select's pick timer.
LobbyPollIntervalSeconds=1
SocialPollIntervalSeconds=3
; Chat is read too, in every signed-in state but Reconnect-only, a match included (ADR-046 §6):
; once a second keeps a conversation flowing. Each conversation keeps its newest lines.
ChatPollIntervalSeconds=1
ChatKeepMessages=100
; Account settings go to the backend once they settle, and wait longer after a send got no answer.
AccountSettingsSendDelaySeconds=1.5
AccountSettingsRetrySeconds=15
AssignmentReadTimeoutSeconds=30
AssignmentPollIntervalSeconds=0.05
ReportAttempts=5
ReportRetryIntervalSeconds=2

[/Script/VeyraUI.VeyraDisplaySettings]
; The pre-game client keeps its window; a match takes the screen in this Display Mode from the
; loading after champion select until it ends, and the window comes back for the results.
; Windowed, BorderlessFullscreen or Fullscreen (Settings Bible 166);
; -VeyraMatchDisplay=<mode> overrides it for one run, as the smoke tests do.
MatchDisplayMode=BorderlessFullscreen
; A change to the window's size, or to a live match's display mode, reverts unless kept (SET-92).
KeepChangesSeconds=15

[/Script/VeyraUI.VeyraKitPresentationSettings]
; How kits show beyond their bodies (ADR-071): presentation, not tuning; every reach comes from Abilities.json.
; A tether's strand from the unit holding its other end, beads flowing along it toward that unit (§2).
+StatusStrands=(Status="patch_threaded")
StrandThickness=7
StrandHeightShare=0.6
StrandBeads=4
StrandFlowSeconds=0.6
StrandEffect=/Game/Veyra/UI/Presentation/Effects/NS_VeyraTrail.NS_VeyraTrail
; A self-buff's aura ring while it lasts, a second ring sweeping across it; an end payload's ring spreading to its reach (§3).
AuraThickness=5
AuraPulseSeconds=1.2
BurstSeconds=0.35
BurstThickness=9
BurstEffect=/Game/Veyra/UI/Presentation/Effects/NS_VeyraCastFlash.NS_VeyraCastFlash
