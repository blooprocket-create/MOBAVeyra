; Veyra project settings (ADR-006). Gameplay tuning never lives in ini files: it is validated,
; designer-editable data owned by its domain (ARCHITECTURE.md §1.3, ADR-006 §6).

[/Script/EngineSettings.GeneralProjectSettings]
