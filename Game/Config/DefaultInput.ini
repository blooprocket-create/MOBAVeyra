[/Script/VeyraMatch.VeyraInputSettings]
; The default profile of Veyra's controls (Settings Bible §1). Mouse-order movement and attacks,
; attack-move, and Quick Cast.
; A click finds a unit within this many units of the cursor's line, as bodies are drawn larger than their capsules.
CursorPickRadius=30
MoveOrderKey=RightMouseButton
AttackMoveKey=A
AttackMoveClickKey=None
AbilityQKey=Q
AbilityWKey=W
AbilityEKey=E
AbilityRKey=R
; Inventory slots 1-6 use their items (ADR-012 §1), on the keys around the vision tool's 4.
Item1Key=One
Item2Key=Two
Item3Key=Three
Item4Key=Five
Item5Key=Six
Item6Key=Seven
; The vision tool, on 4 (ADR-016 §6).
VisionToolKey=Four
; The two Flux Spell slots, on D and F (ADR-015 §1).
Spell1Key=D
Spell2Key=F
; Recall channels home to the fountain (ADR-012 §8).
RecallKey=B
; The camera (ADR-020 §1): Y cycles the mode, and Space holds to centre.
CameraModeKey=Y
HoldToCenterKey=SpaceBar
CameraUpKey=Up
CameraDownKey=Down
CameraLeftKey=Left
CameraRightKey=Right
CameraDragKey=MiddleMouseButton
; The wheel zooms (ADR-052 §3).
CameraZoomInKey=MouseScrollUp
CameraZoomOutKey=MouseScrollDown
MinimapCameraKey=LeftMouseButton
; Pings (ADR-020 §2): hold G or V and click.
PingKey=G
DangerPingKey=V
PingClickKey=LeftMouseButton
; Answer the open remake, surrender or pause vote (ADR-019 §7).
VoteYesKey=F1
VoteNoKey=F2
; The mastery emote shows the player's Mastery Level above their Vanguard (ADR-045 §9).
MasteryEmoteKey=T
RankUpModifierKey=LeftControl
ShowCastRangeKey=LeftShift
; Show Attack Range has no default key (ADR-052 §7).
ShowAttackRangeKey=None
SelectKey=LeftMouseButton
SelfCastKey=LeftAlt
TargetVanguardsOnlyKey=Tilde
HeldMoveOrderIntervalSeconds=0.1

[/Script/VeyraUI.VeyraUIInputSettings]
; The default key of the in-match menu (ADR-010 §4).
MatchMenuKey=Escape
; The shop (ADR-012 §11).
ShopKey=P
; The in-match scoreboard, shown while held (ADR-017 §4).
ScoreboardKey=Tab
; The chat composer (ADR-029 §5).
ChatKey=Enter
; Opens the shop with its search ready for typing (SET-58; ADR-058 §1). Provisional.
