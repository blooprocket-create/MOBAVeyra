; Veyra engine settings (ADR-006). Settings arrive with the milestone that needs them. Some
; WindowsTargetSettings and BuildSettings keys would force VeyraEditor out of the engine's shared
; build environment (ADR-006 §2); check before adding one.
;
; Veyra.uproject disables the AndroidFileServer plugin. Veyra has no Android target, and the
; plugin would otherwise write a generated SecurityToken into this file on the first editor
; launch of every clone. Never commit a generated token.

[SystemSettings]
; Iris replaces the legacy replication system on the game net driver (ADR-006 §5). Replays keep
; the legacy path: the engine's BaseEngine.ini sets bCanUseIris=false for the DemoNetDriver.
net.Iris.UseIrisReplication=1
; Iris replicates only subobjects registered in an actor's replicated subobject list.
net.SubObjects.DefaultUseSubObjectReplicationList=1

[/Script/Engine.Engine]
; Reports the client's tuning hash when joining a server (ADR-006 §6).
LocalPlayerClassName=/Script/VeyraMatch.VeyraLocalPlayer
; The device-local player settings live with the engine's own (ADR-024 §1).
GameUserSettingsClassName=/Script/VeyraSettings.VeyraUserSettings

[/Script/Engine.RendererSettings]
; Custom depth with stencil: the hovered unit's outline reads each shape's side from its stencil (ADR-063 §3).
r.CustomDepth=3

[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/VeyraMatch.VeyraGameMode
; A game starts in the front end, where the player signs in and chooses how to play (ADR-010 §3),
; generated by Game/Scripts/BuildFrontEndMap.ps1. A match server loads the battleground (ADR-011
; §12), generated by Game/Scripts/BuildBattlegroundMap.ps1, unless its command line names another map,
; as development matches name the grey box.
GameDefaultMap=/Game/Veyra/FrontEnd/Maps/L_FrontEnd.L_FrontEnd
ServerDefaultMap=/Game/Veyra/World/Maps/L_Battleground.L_Battleground

[/Script/NavigationSystem.NavigationSystemV1]
; Nothing in Veyra uses Detour crowd following, so no crowd manager is created. Add one back with
; the first movement that needs crowd avoidance.
CrowdManagerClass=None

[/Script/NavigationSystem.RecastNavMesh]
; Navigation is built at runtime: the server builds it for the loaded map, and ability-created
; terrain will change it during play (Battleground Bible §2).
RuntimeGeneration=Dynamic

[/Script/Engine.CollisionProfile]
; Placed markers, such as wards (ADR-016 §6): no body stops on them, but the cursor's unit trace finds
; them, so a player can click a ward they see. AVeyraWard::GetBodyChannel names this channel.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Ignore,bTraceType=False,bStaticObject=False,Name="VeyraMarker")
; Units collide by side (Combat Bible §24; ADR-062 §1): each side's units sit on their own channel and
; pass through each other, blocking the other side's and neutral units. Everything else blocks both, as
; it blocks pawns: structures, terrain, the world. VeyraUnitCollision names these channels.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False,Name="VeyraSideA")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel3,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False,Name="VeyraSideB")
; Playable ground (ADR-040 §4): the battleground's Landscape and generated floors sit on their own channel, so a
; query for ground finds only ground, never a wall standing on it, and a sweep for walls never meets a slope. Every
; body blocks it, so units walk on it. VeyraGround names the channel and the profile.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel4,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=True,Name="VeyraGround")
+Profiles=(Name="VeyraGround",CollisionEnabled=QueryAndPhysics,bCanModify=False,ObjectTypeName="VeyraGround",CustomResponses=,HelpMessage="Playable ground: the battleground's Landscape and generated floors (ADR-040).")

[/Script/IrisCore.ObjectReplicationBridgeConfig]
; The fog gate (ADR-006 §5, ADR-016 §3): units reach no client by default. Vision's groups open each
; to its own side and to the players who see it; one it never heard of reaches nobody.
+FilterConfigs=(ClassName=/Script/VeyraMatch.VeyraVanguardCharacter, DynamicFilterName=NotRouted)
+FilterConfigs=(ClassName=/Script/VeyraAbilities.VeyraDelayedArea, DynamicFilterName=NotRouted)
+FilterConfigs=(ClassName=/Script/VeyraAbilities.VeyraLingeringArea, DynamicFilterName=NotRouted)
+FilterConfigs=(ClassName=/Script/VeyraAbilities.VeyraProjectile, DynamicFilterName=NotRouted)
+FilterConfigs=(ClassName=/Script/VeyraWorld.VeyraFluxborn, DynamicFilterName=NotRouted)
+FilterConfigs=(ClassName=/Script/VeyraWorld.VeyraWildlife, DynamicFilterName=NotRouted)
+FilterConfigs=(ClassName=/Script/VeyraVision.VeyraWard, DynamicFilterName=NotRouted)
+FilterConfigs=(ClassName=/Script/VeyraCombat.VeyraPlacedMarker, DynamicFilterName=NotRouted)
+FilterConfigs=(ClassName=/Script/VeyraAbilities.VeyraCompanion, DynamicFilterName=NotRouted)
+FilterConfigs=(ClassName=/Script/VeyraAbilities.VeyraEcho, DynamicFilterName=NotRouted)
; A side's presence pings and outlines reach that side alone.
+FilterConfigs=(ClassName=/Script/VeyraVision.VeyraVisionTeamState, DynamicFilterName=NotRouted)
; Structures and the Flux Wells stay visible to every player: their state is map knowledge
; (ADR-011 §7, ADR-014 §4, ADR-016 §11).
+FilterConfigs=(ClassName=/Script/VeyraWorld.VeyraStructure, DynamicFilterName=None)
+FilterConfigs=(ClassName=/Script/VeyraWorld.VeyraFluxWell, DynamicFilterName=None)
; Runtime terrain is map knowledge, and every machine's movement must meet it (ADR-032 §4).
+FilterConfigs=(ClassName=/Script/VeyraWorld.VeyraTerrainWall, DynamicFilterName=None)
; So is where Dense Fog lies, the map's or an ability's: a player sees the fog, never who is in it (ADR-036 §1).
+FilterConfigs=(ClassName=/Script/VeyraVision.VeyraDenseFogBank, DynamicFilterName=None)
