; Veyra engine settings (ADR-006). Deliberately empty in M1: rendering, networking and platform
; settings arrive with the milestone that needs them. Some WindowsTargetSettings and
; BuildSettings keys would force VeyraEditor out of the engine's shared build environment
; (ADR-006 §2); check before adding one.
;
; Veyra.uproject disables the AndroidFileServer plugin. Veyra has no Android target, and the
; plugin would otherwise write a generated SecurityToken into this file on the first editor
; launch of every clone. Never commit a generated token.
