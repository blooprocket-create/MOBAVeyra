# Veyra local development stack (ADR-005). LOCAL USE ONLY.
#
#   docker compose up --build
#
# Ports bind to 127.0.0.1 so nothing is reachable from other machines. The
# Postgres password below is a throwaway local credential, not a secret; the
# backend's dev login is enabled by Backend/config/local.json and must never
# be exposed publicly.
#
# The match server is a developer build of Veyra's Linux dedicated server with
# direct connect (ADR-005 step 2). It runs only with its profile, after
# packaging it with Game/Scripts/Package.ps1:
#
#   docker compose --profile match-server up --build match-server
#
# Clients connect to 127.0.0.1:7777. Built this way, the image is also tagged
# veyra-match-server:local, which the backend's allocator starts once per match
# (ADR-007), on ports 7780-7789 and on this project's network. To build the
# image without running the direct-connect server:
#
#   docker compose --profile match-server build match-server
#
# The releases service is the local stand-in for the download CDN (ADR-022 §8):
# it serves the release store in Game/Saved/Releases, which
# Game/Scripts/Publish.ps1 fills, to the launcher Setup installs.
#
#   docker compose up -d releases
#
# Game/Scripts/Host.ps1 runs the same services for a public test (ADR-057): the backend with
# Backend/config/hosted.json, no development routes and match servers on every address, reached
# only through Cloudflare tunnels to the 127.0.0.1 ports below.

name: veyra

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: veyra
      POSTGRES_PASSWORD: veyra-local-only
      POSTGRES_DB: veyra
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veyra -d veyra"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    build: ./Backend
    # Backend/config/local.json, or the file VEYRA_BACKEND_CONFIG names there: Smoke.ps1 and
    # Play.ps1 -Opponent size a scripted match's queue to their clients with scripted.json.
    command: ["-config", "/config/${VEYRA_BACKEND_CONFIG:-local.json}"]
    # The backend starts match servers through the Docker socket (ADR-007 §11).
    # Access to the socket controls the whole Docker host, so this is for a
    # developer machine only; the backend runs as root in its container to
    # open the socket.
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      VEYRA_DATABASE_URL: postgres://veyra:veyra-local-only@postgres:5432/veyra?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  releases:
    image: nginx:stable-alpine
    volumes:
      - ./Game/Saved/Releases:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:8090:80"

  match-server:
    profiles: ["match-server"]
    image: veyra-match-server:local
    build:
      context: Game/Saved/Packages/VeyraServer-Linux/LinuxServer
      dockerfile: ../../../../Docker/Server/Dockerfile
    init: true
    ports:
      - "127.0.0.1:7777:7777/udp"
    # The grey-box map, or VEYRA_MATCH_MAP (such as the battleground,
    # /Game/Veyra/World/Maps/L_Battleground), waiting for two players during
    # loading, or for VEYRA_EXPECTED_PLAYERS. Casts are logged so
    # Game/Scripts/Smoke.ps1 can check them. VEYRA_MATCH_URL_OPTIONS adds
    # developer options to the map URL, such as ?DemoRec=<name> to record a
    # replay or ?VeyraNetStats=<seconds> to log network statistics.
    command:
      - "${VEYRA_MATCH_MAP:-/Game/Veyra/Developer/Maps/L_Greybox}?VeyraExpectedPlayers=${VEYRA_EXPECTED_PLAYERS:-2}${VEYRA_MATCH_URL_OPTIONS:-}"
      - "-port=7777"
      - "-log"
      - "-stdout"
      - "-FullStdOutLogOutput"
      - "-LogCmds=LogVeyraAbilities Verbose"

volumes:
  postgres-data:
