guards:
  - E reduces displacement DISTANCE. Cairn is NOT immune to Pull or Knockback, does not gain Unstoppable,
    and remains interruptible. The sheet contradicts this (register §B3).
  - Q's pull triggers Deep Foundation even though the hook does not stun; slows alone never trigger it.
  - Repeated immobilisation of the SAME Vanguard within a per-target lockout grants no second passive
    shield.
  - Passive and R shields may coexist but share ONE configurable total cap on Cairn-generated shielding.
  - R's central stun and pull are ONE control event for passive purposes; the R-shield contribution is
    the payout instead.
  - Do not grant Health-to-damage scaling merely because he stacks Health.
