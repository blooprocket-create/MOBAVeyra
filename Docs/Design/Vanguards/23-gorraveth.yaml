guards:
  - Passive fires ONCE PER CLEARED CAMP -- not per individual creature and not per last hit.
  - W's wildlife healing is capped per cast, not unlimited per creature.
  - E crosses only short designated traversable terrain gaps, not arbitrary walls.
  - R takedowns extend duration up to a cap; they do NOT reset E or grant unstoppable, invulnerability
    or an execute.
  - '''Drakari'' is a provisional lineage name. He is NOT a Forgeheart like Varkesh.'
  - No camp evolution, no extra Team Flux, and no requirement to occupy a designated jungle role.
  - Has no reliable hard crowd control -- the only Vanguard where canon states this explicitly.
  - ANTAGONIST (2026-09-20). He killed the official who signed the false safety report. He takes contracts,
    delivers exactly what was agreed, and does not care what is standing nearby. He does not help anyone
    who is not paying and says so to their faces. The old line about helping settlements that cannot pay
    him is REMOVED and must not be restored. He is honest and indifferent, not treacherous.
