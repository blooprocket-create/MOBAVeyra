guards:
  - Basic attacks deal MAGIC damage scaling primarily with Magic Power -- unusual for a ranged carry.
  - Basic attack applies one Hex stack; a damaging basic ability applies two, to a two-stack preparatory
    cap.
  - Consuming the proc does not also reapply a stack; proc damage does not recursively trigger or stack
    Hex.
  - The post-Camouflage attack applies two stacks ONLY if the target was not already primed; on a primed
    target it consumes the existing stacks for one normal proc without re-priming.
  - Her tiny visual silhouette confers no hidden hitbox advantage.
  - Secondary R bolts cannot apply Hex, generate further bolts, or recursively trigger Pocket Hex.
