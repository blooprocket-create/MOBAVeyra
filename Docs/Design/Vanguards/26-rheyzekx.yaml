guards:
  - W's active empowers the next Q, never the next basic attack.
  - Razor Anatomy supplies the ability-to-basic cleave cadence; it must not turn him into an Attack Speed or on-hit carry.
  - Razorbound refreshes only when Razorbound itself kills a valid unit during the dash. Passing through, assisting,
    or a later death does not refresh it.
  - Razorbound may use Fluxborn, jungle wildlife, summons or Vanguards as lethal reset opportunities; this is not a
    jungle-role requirement.
  - Skyrend has a clear visible windup and releases three sequential physical-damage waves created by separate slashes.
  - He has no hard crowd control and no innate stealth.
  - His paired scythes are natural forelimb blades. Never add duplicated floating scythes or reinterpret them as a polearm.
  - Rheyzekx is the Scarzekh Alpha of Whetstone City, is feared and worshipped by his people, and treats the city as his
    horde rather than a community he serves.
  - His response to a genuinely superior being is controlled, surgical bloodlust and obsessive study, not berserk rage.
