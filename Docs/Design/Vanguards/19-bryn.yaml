guards:
  - Her personal attack-interval floor does NOT create a second Attack Speed overflow threshold; overflow
    still uses the normal 2.5 attacks-per-second reference.
  - A Breach-consuming Q UPGRADES/REPLACES the passive explosion. One impact, one secondary explosion
    -- never two.
  - Neither explosion recursively triggers Breach or basic-attack On-Hit effects.
  - Q may reset the chambering ANIMATION for responsiveness but never the attack cooldown or the minimum
    interval.
  - Breach must not become an uncapped ramp; changing targets resets the previous target's Breach.
  - W is a champion ability, not an extra ward or a replacement for the dedicated vision-tool slot.
  - Renamed from Tavra (2026-09-20) to resolve the Tavi/Tavra collision. Archived bible versions retain
    the former name.
