guards:
  - One stack per damaging ability cast that hits an enemy Vanguard, irrespective of how many enemies
    are hit.
  - If a cast hits only enemies she cannot legally acquire, the primed passive remains primed and generates
    no fragment.
  - The fragment grants NO vision or reveal and never creates an exception to Dense Fog, stealth or targetability
    rules.
  - R has no built-in stun, execute, displacement, reset or extra debuff.
  - Scaling comes from ability ranks, Magic Power and cooldown access -- not infinite passive stacks or
    extra range.
  - Renamed from Vitra (2026-09-20) to resolve the Vera/Vitra collision, and retitled from 'The Last Light'
    to reduce the roster's four 'The Last --' titles to three. Archived bible versions retain the former
    name and title.
