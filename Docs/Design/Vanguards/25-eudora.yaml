guards:
  - Only ONE Picket may be active; Eudora cannot place a second while one lives.
  - Work has a per-contributor internal cooldown so multi-hit spells, DoT ticks and recursive procs cannot
    farm it.
  - The passive repairs Picket only, up to its maximum. It does NOT heal allies. No Picket, no Work.
  - Bulwark protection is partial and capacity-limited; attacks from uncovered angles, melee attacks and
    ground effects bypass it.
  - Never full gunfire and full defence simultaneously.
  - The server owns Picket's targeting and damage; it has no independent magical vision or fog exception.
  - Do NOT silently assign her Calder's Run as a birthplace.
