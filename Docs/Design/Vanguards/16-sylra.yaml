  - id: lay_the_mist
    category: world_volume
    destructible: false
    note: Creates TRUE Dense Fog following the battleground's normal fog rules.
  - id: waymark
    category: placed_marker
    destructible: false
    note: Ward-style vision outside fog; presence pings inside fog; grants a regenerative shield to nearby
      allies.
  - id: through_the_white
    category: world_volume
    destructible: false
    note: Large corridor or advancing zone of Dense Fog.
vision_touchpoints:
  - ability: q
    effect: Sounded target inside Dense Fog emits a periodic presence ping to Sylra's team
    status: canon
    note: Presence only. Never reveals exact position, model, or targetability to observers outside the
      fog.
  - ability: w
    effect: creates true Dense Fog
    status: canon
    note: Requires runtime-spawnable fog volumes -- an engine capability the Vision Bible does not currently
      address (see ADR-003).
  - ability: e
    effect: ward-style vision outside fog; presence ping inside fog
    status: canon
  - ability: r
    effect: battlefield-scale Dense Fog
    status: canon
    note: Not team invisibility.
guards:
  - Sounded does NOT reveal the target.
  - Created fog obeys ALL normal Dense Fog rules; it is uncertainty, not invisibility.
  - Follow the Bell improves allied movement without granting additional direct vision.
  - Her Bellcraft tradition is neither Pactcraft nor Wakebound and does not rely on Flux.
